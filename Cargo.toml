[package]
name = "opengalgame"
version = "0.5.0"
edition = "2024"
description = "Windows visual novel engine and visual editor"
license = "MIT"
repository = "https://github.com/eveque-dev/opengalgame"
readme = "README.md"
keywords = ["visual-novel", "galgame", "editor", "egui", "windows"]
categories = ["game-engines", "gui"]

[dependencies]
anyhow = "1"
ab_glyph = "0.2"
eframe = { version = "=0.33.3", default-features = false, features = ["default_fonts", "glow", "accesskit"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
rfd = { version = "=0.17.2", default-features = false }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
sha2 = "0.10"
rodio = { version = "=0.21.1", default-features = false, features = ["playback", "wav", "mp3", "vorbis", "flac"] }
windows-sys = { version = "0.61", features = ["Win32_System_LibraryLoader", "Win32_Foundation"] }

[profile.release]
opt-level = 2
lto = "thin"
strip = "debuginfo"
